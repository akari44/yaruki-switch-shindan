<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わが子の"やる気スイッチ"診断</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Yomogi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- タイトル画面 -->
        <div id="screen-start">
            <img class="hero-banner" id="hero-banner" src="" alt="診断">
            <p class="subtitle">
                3問、選ぶだけのシンプル診断。
                <br><strong>ページ移動なし</strong>で、このまま診断結果が見られます。</p>
            <button id="btn-start" class="btn-main">✨ 診断スタート ✨</button>
        </div>

        <!-- 質問画面 -->
        <div id="screen-quiz" class="hidden">
            <p id="question-number"></p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <p id="question-text"></p>
            <div id="choices"></div>
        </div>

        <!-- 結果画面 -->
        <div id="screen-result" class="hidden">
            <div class="result-header">
                <p class="result-lead">あなたのお子さんの<br>やる気スイッチは…</p>
                <img id="result-img" src="" alt="" class="result-illust">
                <div class="result-badge">
                    <h2 id="result-type"></h2>
                </div>
            </div>
            <p class="result-maybe">…かもしれません！</p>
            <p id="result-description"></p>
            <div class="cta-banner">
                <p class="cta-lead" id="cta-lead"></p>
                <span class="cta-arrow">↓</span>
            </div>
            <div class="cta-section">
                <p class="cta-free">無料でできます！</p>
                <ul class="cta-list">
                    <li>やる気スイッチ診断フルバージョン<br><span>（＋5問で詳しい診断）</span></li>
                    <li>診断結果ごとの声かけ・対応のコツ</li>
                    <li id="cta-item3"></li>
                </ul>
                <p class="cta-limited" id="cta-limited"></p>
                <a id="btn-cta" href="#" target="_blank" class="btn-main btn-cta-style"></a>
            </div>
            <div class="offer-section" style="display:none">
                <h3 class="offer-heading" id="offer-heading"></h3>
                <ul class="offer-list" id="offer-list"></ul>
                <a id="btn-cta2" href="#" target="_blank" class="btn-main btn-cta-style"></a>
            </div>
            <div class="sparkles" id="sparkles"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
